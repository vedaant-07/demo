kind = "web"
previewPath = "/"
title = "Premium Matrimony"
version = "1.0.0"
id = "artifacts/matrimony"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20894

[services.development]
run = "pnpm --filter @workspace/matrimony run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matrimony", "run", "build" ]
publicDir = "artifacts/matrimony/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20894"
BASE_PATH = "/"
