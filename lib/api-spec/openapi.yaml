openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Premium Matrimony API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Member profile operations
  - name: interests
    description: Interest/match operations
  - name: stories
    description: Success story operations
  - name: stats
    description: Platform statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List profiles with filters
      parameters:
        - name: gender
          in: query
          schema:
            type: string
        - name: religion
          in: query
          schema:
            type: string
        - name: minAge
          in: query
          schema:
            type: integer
        - name: maxAge
          in: query
          schema:
            type: integer
        - name: city
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Create a new profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/featured:
    get:
      operationId: listFeaturedProfiles
      tags: [profiles]
      summary: Get featured/premium profiles
      responses:
        "200":
          description: Featured profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"

  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a single profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found

  /interests:
    get:
      operationId: listInterests
      tags: [interests]
      summary: List interests sent or received
      responses:
        "200":
          description: Interests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Interest"
    post:
      operationId: sendInterest
      tags: [interests]
      summary: Send interest to a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestInput"
      responses:
        "201":
          description: Interest sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interest"

  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List success stories
      responses:
        "200":
          description: Success stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Submit a success story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      required: [id, name, age, gender, religion, city, photo, bio, featured]
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        religion:
          type: string
        caste:
          type: ["string", "null"]
        city:
          type: string
        state:
          type: ["string", "null"]
        education:
          type: ["string", "null"]
        profession:
          type: ["string", "null"]
        photo:
          type: string
        bio:
          type: string
        featured:
          type: boolean
        createdAt:
          type: string

    ProfileInput:
      type: object
      required: [name, age, gender, religion, city, bio]
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
        religion:
          type: string
        caste:
          type: string
        city:
          type: string
        state:
          type: string
        education:
          type: string
        profession:
          type: string
        photo:
          type: string
        bio:
          type: string

    Interest:
      type: object
      required: [id, fromProfileId, toProfileId, status, createdAt]
      properties:
        id:
          type: integer
        fromProfileId:
          type: integer
        toProfileId:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    InterestInput:
      type: object
      required: [fromProfileId, toProfileId]
      properties:
        fromProfileId:
          type: integer
        toProfileId:
          type: integer

    Story:
      type: object
      required: [id, coupleName, story, photo, marriageYear]
      properties:
        id:
          type: integer
        coupleName:
          type: string
        story:
          type: string
        photo:
          type: string
        marriageYear:
          type: integer
        city:
          type: ["string", "null"]

    StoryInput:
      type: object
      required: [coupleName, story, marriageYear]
      properties:
        coupleName:
          type: string
        story:
          type: string
        photo:
          type: string
        marriageYear:
          type: integer
        city:
          type: string

    PlatformStats:
      type: object
      required: [totalMembers, totalMatches, successStories, citiesCovered]
      properties:
        totalMembers:
          type: integer
        totalMatches:
          type: integer
        successStories:
          type: integer
        citiesCovered:
          type: integer
